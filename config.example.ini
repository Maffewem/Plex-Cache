# /etc/plex-precache/config.ini
[plex]
# Plex on the same box (the Swizzin default).
plex_url = http://127.0.0.1:32400
# install.sh fills this from Plex's Preferences.xml. The PLEX_TOKEN env var overrides it.
plex_token =
# Seconds between checks of what is playing.
poll_interval = 10

# Episodes after the one playing to pull into cache. 0 disables.
next_episodes = 1
# Only cache the first N MB of each upcoming episode (0 = whole file).
next_episode_head_mb = 0

# Also warm the start of everything in "Continue Watching" / On Deck.
on_deck = false
on_deck_limit = 5
on_deck_head_mb = 512

# Files read in parallel. Use 1 on a slow WAN link so the playing file always comes first.
workers = 2
read_block_mb = 8
# Don't re-read a file that was fully cached within this many hours.
# Keep it at or below the mount's --vfs-cache-max-age.
remember_hours = 12
# Start reading this far behind the estimated playhead, to cover bitrate variation.
seek_margin_mb = 64

# Next-episode and On Deck reads are skipped if they would leave less than
# min_free_gb free on the disk holding cache_dir (keep in sync with rclone-mount.env).
# The file that is playing is always cached.
cache_dir = /var/cache/plex-cache
min_free_gb = 10

# Status page, published by nginx at /plexcache/ on Swizzin. 0 disables it.
status_bind = 127.0.0.1
status_port = 8789
# Where the status page reads the mount's cache settings from.
mount_env = /etc/plex-precache/rclone-mount.env

[path_map]
# Only needed if Plex sees media at a different path than this box does
# (e.g. Plex in Docker). Format: path as Plex reports it = path on this box
# /data/media = /mnt/remote/media
